name: install-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Normalization demo (no models needed)
        run: python -m src.normalize

      - name: Import every module
        run: >
          python -c "import importlib;
          [importlib.import_module('src.' + m) for m in
          ['config', 'normalize', 'lexicon', 'data', 'models', 'download', 'prepare_data',
          'train_baseline', 'train_w2v_nn', 'train_bert', 'quantize', 'evaluate']];
          print('all modules import')"

      - name: Rule baseline smoke test
        run: >
          python -c "from src.lexicon import LexiconMatcher, edit_distance;
          m = LexiconMatcher(words={'idiot', 'fuck'}, safe_words=set());
          assert edit_distance('kitten', 'sitting') == 3;
          assert m.find('you are an id10t') == ['idiot'];
          assert m.mask('what the f*ck')[1] == 1;
          assert m.find('gg well played') == [];
          print('rule baseline ok')"
